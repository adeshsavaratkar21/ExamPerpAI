<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FCE34D'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamPrepAi — Student Learning & Exam Preparation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  </head>
  <body class="bg-[#EEF1F6] text-gray-800 antialiased selection:bg-amber-300 selection:text-gray-900">
    <div id="root">
      <div id="app-loading-screen" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0F111A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; padding: 24px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 18px; background: #FCE34D; color: #0F111A; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(252, 227, 77, 0.25); margin-bottom: 16px;">⚡</div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.5px;">ExamPrepAi</h2>
        <p style="font-size: 13px; color: #94A3B8; margin: 0 0 20px 0;">Loading your smart study suite...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(252, 227, 77, 0.2); border-top-color: #FCE34D; border-radius: 50%; animation: examprep-spin 0.8s linear infinite;"></div>
        <style>@keyframes examprep-spin { to { transform: rotate(360deg); } }</style>
        <div id="loading-timeout-msg" style="display: none; margin-top: 24px;">
          <p style="font-size: 12px; color: #94A3B8; margin-bottom: 10px;">Taking longer than usual to connect to assets?</p>
          <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" style="padding: 8px 16px; border-radius: 12px; background: #FCE34D; color: #0F111A; font-weight: 800; font-size: 12px; border: none; cursor: pointer;">
            🔄 Clear Cache &amp; Reload
          </button>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var el = document.getElementById('loading-timeout-msg');
          if (el && document.getElementById('app-loading-screen')) {
            el.style.display = 'block';
          }
        }, 5000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
